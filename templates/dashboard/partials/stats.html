<div class="stats-grid">

    <div class="stat-card">

        <div class="stat-icon green">

            <i class="bi bi-check-circle"></i>

        </div>

        <div>

            <h2>{{ dashboard.submitted_squads }}</h2>

            <p>Submitted Squads</p>

        </div>

    </div>

    <div class="stat-card">

        <div class="stat-icon red">

            <i class="bi bi-hourglass-split"></i>

        </div>

        <div>

            <h2>{{ dashboard.pending_squads }}</h2>

            <p>Pending Squads</p>

        </div>

    </div>

    <div class="stat-card">

        <div class="stat-icon blue">

            <i class="bi bi-heart-pulse"></i>

        </div>

        <div>

            <h2>{{ dashboard.total_vaccinations }}</h2>

            <p>Vaccinations</p>

        </div>

    </div>

    <div class="stat-card">

        <div class="stat-icon orange">

            <i class="bi bi-database-check"></i>

        </div>

        <div>

            <h2>{{ dashboard.total_entries }}</h2>

            <p>Pashudhan Entries</p>

        </div>

    </div>

</div>
