<aside class="sidebar">

    <!-- ==========================================
         Brand
    =========================================== -->

    <div class="sidebar-brand">

        <div class="brand-logo">
            <i class="bi bi-shield-check"></i>
        </div>

        <div class="brand-text">
            <h4>NCMS</h4>

            <small>
                NADCP Campaign<br>
                Management System
            </small>
        </div>

    </div>


    <!-- ==========================================
         Navigation
    =========================================== -->

    <div class="sidebar-nav">

        <div class="sidebar-heading">
            Main Menu
        </div>


        <!-- Dashboard -->

        <a href="{{ url_for('dashboard.index') }}"
           class="{% if request.endpoint == 'dashboard.index' %}active{% endif %}">

            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>

        </a>


        <!-- New Submission -->

        <a href="{{ url_for('submission.index') }}"
           class="{% if request.endpoint and request.endpoint.startswith('submission.') %}active{% endif %}">

            <i class="bi bi-pencil-square"></i>
            <span>New Submission</span>

        </a>


        <!-- Campaigns -->

        <a href="{{ url_for('campaign.index') }}"
           class="{% if request.endpoint and request.endpoint.startswith('campaign.') %}active{% endif %}">

            <i class="bi bi-broadcast"></i>
            <span>Campaigns</span>

        </a>


        <!-- Master Data -->

        <a href="{{ url_for('masterdata.index') }}"
           class="{% if request.endpoint and request.endpoint.startswith('masterdata.') %}active{% endif %}">

            <i class="bi bi-database-fill"></i>
            <span>Master Data</span>

        </a>


        <!-- District Monitoring -->

        <a href="{{ url_for('monitoring.index') }}"
           class="{% if request.endpoint == 'monitoring.index' %}active{% endif %}">

            <i class="bi bi-speedometer2"></i>
            <span>District Monitoring</span>

        </a>


        <!-- Panchayath Monitoring -->

        <a href="{{ url_for('reports.panchayath_achievement') }}"
           class="{% if request.endpoint == 'reports.panchayath_achievement' %}active{% endif %}">

            <i class="bi bi-geo-alt-fill"></i>
            <span>Panchayath Monitoring</span>

        </a>


        <!-- Squad Monitoring -->

        <a href="{{ url_for('monitoring.squads') }}"
           class="{% if request.endpoint == 'monitoring.squads' %}active{% endif %}">

            <i class="bi bi-people-fill"></i>
            <span>Squad Monitoring</span>

        </a>


        <!-- Reports -->

        <a href="{{ url_for('reports.index') }}"
           class="{% if request.endpoint and request.endpoint.startswith('reports.') and request.endpoint != 'reports.panchayath_achievement' %}active{% endif %}">

            <i class="bi bi-file-earmark-bar-graph-fill"></i>
            <span>Reports</span>

        </a>


        <!-- ======================================
             Administration
        ======================================= -->

        <hr class="sidebar-divider">

        <div class="sidebar-heading">
            Administration
        </div>


        <!-- Settings -->

        <a href="{{ url_for('settings.index') }}"
           class="{% if request.endpoint and request.endpoint.startswith('settings.') %}active{% endif %}">

            <i class="bi bi-gear-fill"></i>
            <span>Settings</span>

        </a>


        <!-- Logout -->

        <form
            method="POST"
            action="{{ url_for('auth.logout') }}"
            class="sidebar-logout-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <button
                type="submit"
                class="sidebar-logout-button"
            >
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>

        </form>

    </div>

</aside>
