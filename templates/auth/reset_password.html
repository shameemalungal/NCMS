{% extends "base.html" %}

{% block title %}
    Reset User Password | NCMS
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-xl-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h4 class="mb-1">
                        Reset User Password
                    </h4>

                    <p class="text-muted mb-4">
                        Set a new temporary password for
                        <strong>{{ user.username }}</strong>.
                    </p>

                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle me-1"></i>

                        The user will be required to change this
                        password after the next login.
                    </div>

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >


                        <div class="mb-3">

                            <label
                                for="new_password"
                                class="form-label"
                            >
                                New Temporary Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="new_password"
                                name="new_password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                            <div class="form-text">
                                Minimum 8 characters.
                            </div>

                        </div>


                        <div class="mb-4">

                            <label
                                for="confirm_password"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-warning"
                            >
                                <i class="bi bi-key-fill me-1"></i>
                                Reset Password
                            </button>

                            <a
                                href="{{ url_for('auth.users') }}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
