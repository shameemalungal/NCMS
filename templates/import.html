{% extends "base.html" %}

{% block content %}

<h2>Import Master Data</h2>

<form method="POST" enctype="multipart/form-data">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >   

    <input type="file" name="file" required>

    <button type="submit">
        Import
    </button>

</form>

{% endblock %}
