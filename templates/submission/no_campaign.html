{% extends "base.html" %}

{% block title %}No Active Campaign - NCMS{% endblock %}

{% block content %}
<style>
    .empty-page {
        min-height: 65vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .empty-card {
        width: 100%;
        max-width: 620px;
        background: #ffffff;
        border: 1px solid #e4e7ec;
        border-radius: 16px;
        padding: 38px 30px;
        text-align: center;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.07);
    }

    .empty-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f4f7;
        color: #667085;
        font-size: 1.7rem;
    }

    .empty-card h2 {
        color: #172033;
        font-size: 1.45rem;
        font-weight: 800;
        margin-bottom: 9px;
    }

    .empty-card p {
        color: #667085;
        font-size: 0.86rem;
        line-height: 1.65;
        margin-bottom: 0;
    }
</style>

<div class="empty-page">
    <div class="empty-card">
        <div class="empty-icon">
            <i class="bi bi-calendar-x"></i>
        </div>

        <h2>No Active Campaign</h2>

        <p>
            No campaign is currently active for public submissions.
            Please contact the campaign administrator if you require assistance.
        </p>
    </div>
</div>
{% endblock %}
