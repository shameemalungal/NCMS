<div class="page-header">

    <div>
        <h1 class="page-title">{{ title }}</h1>

        {% if subtitle %}
        <p class="page-description">
            {{ subtitle }}
        </p>
        {% endif %}
    </div>

    {% if action %}
    <div>
        {{ action|safe }}
    </div>
    {% endif %}

</div>
