<div class="stat-card">

    <div class="stat-card-icon {{ color }}">
        <i class="{{ icon }}"></i>
    </div>

    <div class="stat-card-body">

        <div class="stat-card-title">
            {{ title }}
        </div>

        <div class="stat-card-value"
             {% if value_id %}
             id="{{ value_id }}"
             {% endif %}>
            {{ value }}
        </div>

        <div class="stat-card-subtitle">
            {{ subtitle }}
        </div>

    </div>

</div>
