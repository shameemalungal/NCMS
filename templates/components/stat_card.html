<div class="stat-card">

    <div class="stat-card-icon bg-{{ color|default('success') }}">
        <i class="{{ icon }}"></i>
    </div>

    <div class="stat-card-content">

        <div class="stat-card-title">
            {{ title }}
        </div>

        <div class="stat-card-value">
            {{ value }}
        </div>

        {% if subtitle %}
        <div class="stat-card-subtitle">
            {{ subtitle }}
        </div>
        {% endif %}

    </div>

</div>
