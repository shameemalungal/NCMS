name: NCMS CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NCMS_ENVIRONMENT: testing
      NCMS_SECRET_KEY: ci-test-secret
      NCMS_ADMIN_USERNAME: ci-admin
      NCMS_ADMIN_PASSWORD: ci-password
      DATABASE_URL: sqlite:///:memory:

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run release smoke tests
        run: python -m pytest -q
